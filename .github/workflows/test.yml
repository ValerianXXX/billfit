name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify calculator entry point without optional site packages
        run: python -S plugins/billfit/skills/billfit/scripts/billfit_cli.py scope
      - name: Install optional integration profiles
        run: python -m pip install -r plugins/billfit/requirements-agent.txt -r plugins/billfit/requirements-image-input.txt
      - name: Run all tests including image preparation, PDF and real SDK recovery
        run: python -m unittest discover -s plugins/billfit/tests -v
