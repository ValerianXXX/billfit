name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s plugins/billfit/tests -v
      - name: Install optional integration profiles
        run: python -m pip install -r plugins/billfit/requirements-agent.txt -r plugins/billfit/requirements-bill-input.txt
      - name: Verify optional protocol and PDF integrations
        run: python -m unittest discover -s plugins/billfit/tests -p test_modernization.py -v
      - name: Verify usage errors and recovery with the installed MCP SDK
        run: python -m unittest discover -s plugins/billfit/tests -p test_usage_integration.py -v
